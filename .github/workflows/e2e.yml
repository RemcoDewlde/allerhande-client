name: E2E smoke tests

on:
  schedule:
    # Run daily at 07:00 UTC to catch upstream API breakage early
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: E2E smoke tests
        run: npm run test:e2e
